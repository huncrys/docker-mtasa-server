variables:
  CI_DOCKERHUB_IMAGE: huncrys/mtasa-server

.defaults: &defaults
  licenses: GPL-3.0+
  platforms:
    - linux/amd64
    - linux/386
#    - linux/arm64
#    - linux/arm/v7

include:
  - component: $CI_SERVER_FQDN/oaklab/ci-templates/hadolint@10
  - component: $CI_SERVER_FQDN/oaklab/ci-templates/oci-publish@10
    inputs:
      <<: *defaults
  - component: $CI_SERVER_FQDN/oaklab/ci-templates/oci-publish@10
    inputs:
      <<: *defaults
      variant: luajit
      args:
        - IS_LUAJIT=true
