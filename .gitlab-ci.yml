spec:
  inputs:
    no-cache:
      type: boolean
      default: false
      description: Whether to disable the build cache when building the image.
---
variables:
  CI_DOCKERHUB_IMAGE: huncrys/mtasa-server

include:
  - component: $CI_SERVER_FQDN/oaklab/ci-templates/hadolint@12
  - component: $CI_SERVER_FQDN/oaklab/ci-templates/oci-publish-multi@12
    inputs:
      licenses: GPL-3.0-or-later
      platforms:
        - linux/amd64
        - linux/386
        - linux/arm64
        - linux/arm/v7
      registry-cache: true
      no-cache: $[[ inputs.no-cache ]]
      targets:
        # trailing "=" keeps the tag suffix empty, same as the "default" target would
        - official=
        - luajit
